<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
    <script type="importmap"> {
        "imports": {
            "@floating-ui/dom": "https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.7.6/dist/floating-ui.dom.esm.min.js",
            "vanilla-calendar-pro": "https://cdn.jsdelivr.net/npm/vanilla-calendar-pro@3.4.0/index.mjs"
        }
    }</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.min.js" integrity="sha384-BJf/nQgxZJU68GxBse97Vdlc8Rh+z9PzzXiS3/BjV+1nQPR7IKn+iJnD3DJvCMaU" crossorigin="anonymous"></script>
</head>
<body>
    <h1>LISTE DES ENSEIGNANTS</h1>
    <table>
        <thead>
            <tr>
                <th>N</th>
                <th>Nom</th>
                <th>Prenom</th>
                <th>Diplome</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>ZOZO</td>
                <td>jean</td>
                <td>Doctorat</td>
            </tr>
            <tr>
                <td>2</td>
                <td>DJIGBE</td>
                <td>Cravate</td>
                <td rowspan="2" align="center">ingenieur</td>
            </tr>
            <tr>
                <td>3</td>
                <td>PAPOUE</td>
                <td>Clecle</td>
            </tr>
            <tr>
                <td>4</td>
                <td>GOHOU</td>
                <td>Michel</td>
                <td>Assistant ingenieur</td>
            </tr>
            <tr>
                <td colspan="3">TOTAL</td>
                <td colspan="3">4</td>
            </tr>
        </tbody>
</body>
</html>
