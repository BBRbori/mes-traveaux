
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Téléphone EIG</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="telephone">

        <!-- Ecran du téléphone -->
        <div class="ecran">
            <img src="logo.svg" alt="Logo EIG">
        </div>

        <!-- Clavier -->
        <div class="clavier">

            <!-- Boutons du haut -->
            <div class="boutons">
                <div class="appel">☎</div>
                <div class="central"></div>
                <div class="raccrocher">☎</div>
            </div>

            <!-- Chiffres -->
            <div class="chiffres">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
                <div>7</div>
                <div>8</div>
                <div>9</div>
                <div>*</div>
                <div>0</div>
                <div>#</div>
            </div>

        </div>

    </div>

</body>
</html>
